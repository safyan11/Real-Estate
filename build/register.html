<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="icon" type="image/png" href="./img/logo.png" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 backdrop-blur-sm flex flex-col items-center justify-center bg-cover p-4 " style="background-image: url(./img/herobg.png);">
  
    <div class="text-5xl font-bold py-10 text-white text-center drop-shadow-lg fadeInUp">
    <h1>  Unlock Exclusive Properties — Register Now!</h1>
    </div>
  
    <div class="bg-white/30 backdrop-blur-md p-8 rounded-2xl shadow-lg w-full max-w-md border border-white/50">
      <h2 class="text-2xl font-bold mb-6 text-center">Create an Account</h2>
      
      <form action="#" method="POST" class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
          <input type="text" id="name" name="name" required
            class="mt-1 block w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-black focus:outline-none"/>
        </div>
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
            class="mt-1 block w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-black focus:outline-none"/>
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
            class="mt-1 block w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-black focus:outline-none"/>
        </div>
        
        <div>
          <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" required
            class="mt-1 block w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-black focus:outline-none"/>
        </div>
        
     <div class="flex justify-center ">   <a href="login.html"  type="submit"
        class="w-full bg-black hover:bg-transparent text-white hover:text-black hover:border hover:border-black font-semibold py-2 px-24 text-center  rounded-xl transition duration-300">Register</a></div>
          
        
      </form>
      
      <p class="text-sm text-gray-600 text-center mt-4">
        Already have an account? 
        <a href="login.html" class="text-black hover:underline">Login</a>
      </p>
    </div>



    <style>
        @keyframes fadeInUp {
          0% {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
          }
          100% {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }
        .animate-fade-in-up {
          animation: fadeInUp 1s ease-out forwards;
        }
      </style>
  
  </body>
  
  
</html>
